[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-heart-ranker"
version = "0.1.0"
description = "Local Telegram channel heart-reaction ranking bot."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "Telethon>=1.36,<2",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
tg-heart-ranker = "tg_heart_ranker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
